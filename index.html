<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/shelf.css" />
</head>
<body class="home">

  <div class="shelf-scene">
    <a class="shelf-wordmark" href="#/" id="wordmark">UNA</a>
    <canvas id="shelfCanvas" aria-label="3D bookshelf of Una Chen's portfolio"></canvas>

    <div class="shelf-hint" id="shelfHint">Drag to browse · Click a book to open</div>

    <div id="shelfFallback" class="shelf-fallback">
      <p>這個瀏覽器不支援 3D 書架效果，以下是所有內容的直接連結。</p>
      <nav class="fallback-nav">
        <a href="about.html">About me</a>
        <a href="works/atm-milano.html">ATM Milano</a>
        <a href="works/nexus.html">NEXUS</a>
        <a href="works/easy-energy.html">Easy Energy</a>
        <a href="works/phoenix.html">The Pavilion of Phoenix</a>
      </nav>
    </div>
  </div>

  <!-- 詳情面板：點書後原地浮出 -->
  <aside id="detailPanel" class="detail-panel" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dpTitle">
    <button type="button" id="dpClose" class="dp-close" aria-label="Close">×</button>
    <div class="dp-scroll" id="dpScroll">
      <header class="dp-head">
        <div class="dp-meta">
          <span id="dpCategory"></span>
          <span id="dpYear"></span>
        </div>
        <h1 class="dp-title" id="dpTitle"></h1>
        <div class="dp-tags" id="dpTags"></div>
        <p class="dp-intro" id="dpIntro"></p>
        <div class="dp-bottom">
          <div class="dp-metablock">
            <div class="dp-meta-label" id="dpMetaLabel"></div>
            <div class="dp-meta-value" id="dpMetaValue"></div>
          </div>
          <a class="dp-enter" id="dpEnter" href="#">More Detail →</a>
        </div>
      </header>

    </div>
  </aside>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/spring.js"></script>
  <script src="js/books-data.js"></script>
  <script src="js/procedural-art.js"></script>
